<title>Pokémon Binder</title>
<style>
:root{box-sizing:border-box;--bg:#f6f6f3;--card:#fff;--tx:#1d1d1b;--mut:#76766f;--bd:#e0e0d8;--ac:#d63a2f;--ok:#2e9e5b;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#222220;--tx:#f0f0ea;--mut:#9a9a92;--bd:#38382f;--ac:#ef5a4e;--ok:#4cc27c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141413;--card:#222220;--tx:#f0f0ea;--mut:#9a9a92;--bd:#38382f;--ac:#ef5a4e;--ok:#4cc27c;color-scheme:dark}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 ui-rounded,"SF Pro Rounded",-apple-system,system-ui,"Segoe UI",sans-serif}
header{padding:12px 16px 4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:19px;margin:0;flex:1}h2{font-size:16px;margin:18px 0 8px}
#prog{color:var(--mut);font-size:13px;white-space:nowrap}
main{padding:8px 16px 90px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:13px 0;border:0;background:none;color:var(--mut);font:600 14px inherit}
nav button.on{color:var(--ac)}
input,select,textarea,button{font:inherit;color:inherit}
input[type=search],input[type=text],input[type=number],input:not([type]),select,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);font-size:16px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chips button,.pri,#ex,#im,.add button{border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:7px 14px;text-transform:capitalize}
.chips .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.pri{background:var(--ac);color:#fff;border-color:var(--ac);width:100%;padding:12px;border-radius:10px;margin-top:12px;text-transform:none}
.danger{margin-top:14px;width:100%;padding:11px;border:1px solid var(--ac);color:var(--ac);background:none;border-radius:10px}
.row{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--bd)}
.row img{width:44px;height:44px;object-fit:contain;flex:none}.tile img{flex:1 1 0;min-height:0;max-width:100%;object-fit:contain}.sheet h2 img{width:56px;height:56px;object-fit:contain;vertical-align:middle}
.num{color:var(--mut);width:54px;font-size:13px;font-variant-numeric:tabular-nums}
.row b{flex:1;font-weight:600}.row small{color:var(--mut);font-size:12px}
.empty{color:var(--mut);text-align:center;padding:30px}
.nav{display:flex;align-items:center;justify-content:space-between;text-align:center;margin:6px 0 12px}
.nav div{display:flex;flex-direction:column}.nav small{color:var(--mut)}
.nav button{width:52px;height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--card);font-size:18px}
.grid{display:grid;gap:8px}
.tile{position:relative;--c:var(--bd);--c2:transparent;aspect-ratio:5/7;background:transparent;border:2px dashed color-mix(in srgb,var(--c) 50%,transparent);border-radius:10px;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;overflow:hidden;min-width:0}
.tile b{font-size:13px;line-height:1.15;word-break:break-word}.tile small{color:var(--mut);font-size:11px}
.tile.got{border-style:solid;border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.tile:before{content:attr(data-t);position:absolute;right:-2px;bottom:-4px;font-size:46px;font-weight:700;line-height:1;color:color-mix(in srgb,var(--c) 14%,transparent);pointer-events:none}
.tile:after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--c2)}
.tile:not(.got) img{filter:grayscale(1);opacity:.45}.tile input{position:absolute;top:4px;right:4px}
.tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:2px}.tag{font-size:10px;line-height:1.5;padding:0 6px;border-radius:6px;background:color-mix(in srgb,var(--tc) 30%,transparent);text-transform:capitalize;font-weight:500;color:var(--tx)}
.row b .tags{justify-content:flex-start}.sheet .tags{justify-content:flex-start;margin:0 0 8px}.tile.hl{box-shadow:0 0 0 3px var(--ac)}
.tile.ghost{background:none;border-style:dashed}
.cnt{text-align:center;color:var(--mut);margin-top:12px}
label{display:block;margin:10px 0;font-size:13px;color:var(--mut)}label input,label select{margin-top:4px;color:var(--tx)}
.two{display:flex;gap:10px}.two>*{flex:1}
.sum{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:10px 0}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:flex-end;z-index:5}
#modal.open{display:flex}
.sheet{background:var(--bg);width:100%;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:80%;overflow:auto}
.sheet h2{margin-top:0}.own{display:flex;gap:10px;align-items:center;color:var(--tx);font-size:16px}
.var{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.var button{border:0;background:none;color:var(--mut);font-size:16px}
.add{display:flex;gap:8px;margin-top:10px}
.gen{margin:12px 0}.gh{display:flex;gap:8px;align-items:baseline;margin-bottom:4px}.gh small{color:var(--mut)}.gh small:last-child{margin-left:auto}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.fill{height:100%;background:var(--ac);border-radius:6px;transition:width .4s}.fill.full{background:var(--ok)}
.fine{color:var(--mut);font-size:12px;margin-top:22px}.cnt.ok{color:var(--ok);font-weight:600}
.grid.done{outline:2px solid var(--ok);outline-offset:6px;border-radius:12px;margin:8px 6px}
.fl{position:fixed;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;z-index:9}
.fb{background:var(--card);border:2px solid var(--ok);color:var(--ok);font-weight:700;padding:12px 22px;border-radius:14px;animation:pop 1.6s ease both}
.fl i{position:absolute;width:9px;height:9px;border-radius:2px;animation:fly 1.1s ease-out both}
@keyframes pop{0%{transform:scale(.6);opacity:0}15%{transform:scale(1.08);opacity:1}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
@keyframes fly{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--x),var(--y)) rotate(240deg) scale(.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.fl i{display:none}}
.stick{position:sticky;top:0;z-index:2;background:var(--bg);padding:4px 0 6px}
.stick .two{margin-top:2px}.stick select{padding:9px 10px;font-size:15px}
.st{color:#d9a400}.jp{margin:0 0 10px}.jp button{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:10px}
.bar.sm{height:5px;width:130px;margin:5px auto 0}
.map{display:flex;flex-wrap:wrap;gap:5px}.map i{display:block;width:24px;height:24px;border-radius:6px;border:1px solid var(--bd)}
.note{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;margin:0 0 8px;font-size:13px}
.note button{border:1px solid var(--bd);background:var(--bg);border-radius:999px;padding:5px 12px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(58px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);border-radius:12px;padding:10px 14px;display:none;justify-content:space-between;align-items:center;z-index:20;font-size:14px}
#toast.on{display:flex}#toast button{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline}
.tile{transition:transform .1s}.tile:active{transform:scale(.97)}
.grid.sl{animation:sl .22s ease-out}.grid.sr{animation:sr .22s ease-out}
@keyframes sl{from{transform:translateX(40px);opacity:.3}}@keyframes sr{from{transform:translateX(-40px);opacity:.3}}
#qa{border:0;background:var(--ac);color:#fff;width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1;flex:none}
.ghostb{background:var(--card)!important;color:var(--tx)!important;border-color:var(--bd)!important}
.clist{display:flex;flex-direction:column;gap:8px;padding:8px;border-radius:14px}
.clist.done{outline:2px solid var(--ok);outline-offset:6px;margin:8px 6px}
.clist.sl{animation:sl .22s ease-out}.clist.sr{animation:sr .22s ease-out}
.crow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:2px dashed color-mix(in srgb,var(--c) 50%,transparent);border-radius:12px}
.crow.got{border-style:solid;border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.crow.hl{box-shadow:0 0 0 3px var(--ac)}
.crow img{width:56px;height:56px;object-fit:contain;flex:none}.crow:not(.got) img{filter:grayscale(1);opacity:.45}
.ci{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}.ci b{font-size:17px}.ci small{color:var(--mut)}.ci .tags{justify-content:flex-start}
.ck{width:34px;height:34px;border-radius:50%;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex:none}
.crow.got .ck{background:var(--ok);border-color:var(--ok)}.dtl{border:0;background:none;font-size:22px;color:var(--mut);padding:4px 8px}
.pimg{width:100%;border-radius:10px;margin:8px 0}
.qp{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;min-height:24px}
.qc{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--card);border:1px solid var(--bd)}.qc.have{opacity:.6}.qc.bad{border-color:var(--ac);color:var(--ac)}
.sp2{margin:0 0 10px;font-size:14px}.slist{max-height:42vh;overflow:auto}
.bgd{display:flex;flex-wrap:wrap;gap:8px}.bg1{border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:8px 12px;font-size:13px}.bg1.full{border-color:var(--ok);color:var(--ok);font-weight:600}
.step{display:flex;align-items:center;gap:10px;margin:10px 0}.step button{width:34px;height:34px;border-radius:50%;border:1px solid var(--bd);background:var(--card);font-size:18px}
#prog{display:flex;align-items:center;gap:8px}#prog small{font-size:12px}#prog svg text{fill:var(--tx)}
.tag{display:inline-flex;align-items:center;gap:3px}.tag svg{flex:none}
.pg{position:relative;padding-left:22px}.pg.r{padding-left:0;padding-right:22px}
.rings{position:absolute;top:0;bottom:0;left:0;width:16px;display:flex;flex-direction:column;justify-content:space-around;align-items:center;padding:16px 0}
.pg.r .rings{left:auto;right:0}.rings i{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--mut);background:var(--bg);opacity:.75}
.rb{display:flex;justify-content:space-between;align-items:baseline;border-left:4px solid var(--g);background:color-mix(in srgb,var(--g) 14%,transparent);border-radius:8px;padding:6px 12px;margin:0 0 10px}
.rb b{font-size:14px}.rb span{font-size:12px;color:var(--mut)}
.holo{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.45) 50%,transparent 62%);background-size:300% 100%;background-position:150% 0;animation:sh 7s ease-in-out infinite}
@keyframes sh{0%,60%{background-position:150% 0}100%{background-position:-50% 0}}
.tile input{appearance:none;-webkit-appearance:none;width:22px;height:22px;margin:0;border:2px solid color-mix(in srgb,var(--c) 60%,var(--bd));border-radius:50%;background:var(--card)}
.tile input:checked{background:var(--ok);border-color:var(--ok)}
.tile input:checked::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.ck{position:relative}.crow.got .ck::after{content:"";position:absolute;left:10px;top:4px;width:7px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.tile.nw input:checked::after,.crow.nw .ck::after{animation:ck .34s ease-out}
@keyframes ck{0%{clip-path:inset(calc(100% - 4px) 100% 0 0)}40%{clip-path:inset(calc(100% - 4px) 0 0 0)}100%{clip-path:inset(0)}}
@media (prefers-reduced-motion:reduce){.holo{display:none}.tile.nw input:checked::after,.crow.nw .ck::after{animation:none}}
:root[data-theme="black"]{--bg:#000;--card:#0d0d0d;--tx:#f0f0ea;--mut:#8f8f88;--bd:#2a2a28;--ok:#4cc27c;color-scheme:dark}

 const rd=()=>({c:Math.max(1,Math.min(N.length,+$("sc").value||1)),r:Math.max(1,Math.min(6,+$("sr").value||1)),l:Math.max(1,Math.min(6,+$("sl").value||1)),s:+$("ss").value});
 const sum=()=>{const d=rd(),ps=Math.ceil(d.c/(d.r*d.l));$("sum").textContent=d.c+" cards at "+d.r*d.l+" per page side = "+ps+" page sides, so "+(d.s==2?Math.ceil(ps/2)+" sleeve sheets (front and back)":ps+" sleeve pages")+"."};
 ["sc","sr","sl","ss"].forEach(i=>$(i).oninput=sum);sum();
 $("th").innerHTML=["auto","light","dark","black"].map(v=>'<option value="'+v+'"'+((S.theme||"auto")==v?" selected":"")+'>'+v[0].toUpperCase()+v.slice(1)+'</option>').join("");$("th").onchange=e=>{S.theme=e.target.value;save();theme()};
 $("ts").innerHTML=[[100,"Normal"],[115,"Large"],[130,"Extra large"]].map(a=>'<option value="'+a[0]+'"'+((S.ts||100)==a[0]?" selected":"")+'>'+a[1]+'</option>').join("");$("ts").onchange=e=>{S.ts=+e.target.value;save();theme()};
 $("sv").onclick=()=>{const d=rd(),nm=$("sn").value.trim()||"My Pokémon Binder",spv=$("sp")?$("sp").checked:false,oldP=per(),newP=d.r*d.l,
  fin=()=>{const sd=S.sides;Object.assign(S,{name:nm,count:d.c,rows:d.r,cols:d.l,sides:d.s,setup:true,sprites:spv});save();tab="list";page=0;$("modal").className="";render()};
  if(S.setup&&ownedCount()>0&&(oldP!=newP||S.sides!=d.s))reorderWarn(oldP,newP,d,fin);else fin()};
 $("ex").onclick=()=>{S.lastBackup=Date.now();save();$("bk").value=JSON.stringify(S);$("bk").select();try{document.execCommand("copy")}catch(e){}};
 $("im").onclick=()=>importJSON($("bk").value);
 $("rs").onclick=()=>{if(!rst){rst=1;$("rs").textContent="Tap again to confirm reset";return}rst=0;S.owned={};S.vars={};S.up={};S.dup={};S.log=[];save();render()};
 $("sh").onclick=shareBackup;$("imf").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importJSON(r.result);r.readAsText(f)};
}
function modal(n){
 const v=S.vars[n]||[],m=$("modal");
 m.innerHTML='<div class="sheet"><h2>'+im(n)+' #'+pn(n)+' '+N[n-1]+'</h2>'+tags(n)+'<label class="own"><input id="mo" type="checkbox" '+(S.owned[n]?"checked":"")+'> Slot filled</label><label class="own"><input id="mu" type="checkbox" '+(S.up[n]?"checked":"")+'> ★ Want an upgrade</label><div class="step">Extras to trade <button id="dm">−</button><b id="dc">'+(S.dup[n]||0)+'</b><button id="dp">+</button></div><div>'+(v.map((x,i)=>'<div class="var">'+esc(x)+'<button data-d="'+i+'">✕</button></div>').join("")||'<small style="color:var(--mut)">No variants noted yet</small>')+'</div><div class="add"><input id="vi" placeholder="Add variant, e.g. Holo or Surfing"><button id="va">Add</button></div><button class="pri" id="vc">Done</button></div>';
 m.className="open";
 $("mo").onchange=e=>setOwned(n,e.target.checked);
 $("mu").onchange=e=>{if(e.target.checked)S.up[n]=1;else delete S.up[n];save()};
 const dd=k=>{const c=Math.max(0,(S.dup[n]||0)+k);if(c)S.dup[n]=c;else delete S.dup[n];save();$("dc").textContent=c};$("dm").onclick=()=>dd(-1);$("dp").onclick=()=>dd(1);
 $("va").onclick=()=>{const t=$("vi").value.trim();if(!t)return;(S.vars[n]=S.vars[n]||[]).push(t);setOwned(n,1);save();modal(n)};
 m.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{S.vars[n].splice(+b.dataset.d,1);save();modal(n)});
 $("vc").onclick=()=>{m.className="";render()};
 m.onclick=e=>{if(e.target===m){m.className="";render()}};
}
$("main").onclick=e=>{
 const t=e.target;
 if(t.id=="bkb"){doBackup();render();return}
 if(t.id=="shp"){shop();return}if(t.id=="sbk"){shareBackup();return}if(t.id=="pp"){photo();return}
 if(t.id=="vw"){S.view=S.view=="list"?"grid":"list";save();vBinder();return}
 const cr=t.closest(".crow");if(cr){const n=+cr.dataset.t;if(t.closest(".dtl"))modal(n);else{setOwned(n,!S.owned[n]);vBinder();flush()}return}
 if(t.id=="nm"){if(nextMissing())render();else toast("Nothing missing. Binder complete!");return}
 const a=t.closest("[data-a]");if(a){go(page+ +a.dataset.a,+a.dataset.a>0?"sl":"sr");return}
 const mp=t.closest("[data-p]");if(mp){tab="binder";page=+mp.dataset.p;hl=0;render();window.scrollTo(0,0);return}
 const r=t.closest(".row"),tl=t.closest(".tile[data-t]");if(!r&&!tl)return;
 const n=+(r?r.dataset.n:tl.dataset.t);
 if(t.type=="checkbox"){setOwned(n,t.checked);if(tl)vBinder();flush();return}
 if(r){tab="binder";page=Math.floor((n-1)/per());hl=n;render();window.scrollTo(0,0)}else modal(n);
};
$("toast").onclick=e=>{if(e.target.id=="ub"){const a=U.pop();if(a){const g=a.g;undoOne(a);while(g&&U.length&&U[U.length-1].g==g)undoOne(U.pop());save();pend=null;render()}$("toast").className=""}};
$("qa").onclick=quick;
let sx=0,sy=0;
$("main").addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$("main").addEventListener("touchend",e=>{if(tab!="binder"||$("modal").className)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>60&&Math.abs(dx)>1.5*Math.abs(dy))go(page+(dx<0?1:-1),dx<0?"sl":"sr")},{passive:true});
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;rst=0;render()});
theme();render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
