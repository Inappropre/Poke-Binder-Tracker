<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pokémon Binder</title>
<style>
:root{box-sizing:border-box;--bg:#f6f6f3;--card:#fff;--tx:#1d1d1b;--mut:#76766f;--bd:#e0e0d8;--ac:#d63a2f;--ok:#2e9e5b;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#222220;--tx:#f0f0ea;--mut:#9a9a92;--bd:#38382f;--ac:#ef5a4e;--ok:#4cc27c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141413;--card:#222220;--tx:#f0f0ea;--mut:#9a9a92;--bd:#38382f;--ac:#ef5a4e;--ok:#4cc27c;color-scheme:dark}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,system-ui,"Segoe UI",sans-serif}
header{padding:12px 16px 4px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h1{font-size:19px;margin:0}h2{font-size:16px;margin:18px 0 8px}
#prog{color:var(--mut);font-size:13px;white-space:nowrap}
main{padding:8px 16px 90px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:13px 0;border:0;background:none;color:var(--mut);font:600 14px inherit}
nav button.on{color:var(--ac)}
input,select,textarea,button{font:inherit;color:inherit}
input[type=search],input[type=text],input[type=number],input:not([type]),select,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);font-size:16px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok);flex:none}
.chips{display:flex;gap:8px;margin:10px 0}
.chips button,.pri,#ex,#im,.add button{border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:7px 14px;text-transform:capitalize}
.chips .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.pri{background:var(--ac);color:#fff;border-color:var(--ac);width:100%;padding:12px;border-radius:10px;margin-top:12px;text-transform:none}
.danger{margin-top:14px;width:100%;padding:11px;border:1px solid var(--ac);color:var(--ac);background:none;border-radius:10px}
.row{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--bd)}
.row img{width:44px;height:44px;object-fit:contain;flex:none}.tile img{flex:1 1 0;min-height:0;max-width:100%;object-fit:contain}.sheet h2 img{width:56px;height:56px;object-fit:contain;vertical-align:middle}
.num{color:var(--mut);width:48px;font-size:13px;font-variant-numeric:tabular-nums}
.row b{flex:1;font-weight:600}.row small{color:var(--mut);font-size:12px}
.empty{color:var(--mut);text-align:center;padding:30px}
.nav{display:flex;align-items:center;justify-content:space-between;text-align:center;margin:6px 0 12px}
.nav div{display:flex;flex-direction:column}.nav small{color:var(--mut)}
.nav button{width:52px;height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--card);font-size:18px}
.grid{display:grid;gap:8px}
.tile{position:relative;--c:var(--bd);--c2:transparent;aspect-ratio:5/7;background:transparent;border:2px dashed color-mix(in srgb,var(--c) 50%,transparent);border-radius:10px;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;overflow:hidden;min-width:0}
.tile b{font-size:13px;line-height:1.15;word-break:break-word}.tile small{color:var(--mut);font-size:11px}
.tile.got{border-style:solid;border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.tile:before{content:attr(data-t);position:absolute;right:-2px;bottom:-4px;font-size:46px;font-weight:700;line-height:1;color:color-mix(in srgb,var(--c) 14%,transparent);pointer-events:none}
.tile:after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--c2)}
.tile:not(.got) img{filter:grayscale(1);opacity:.45}.tile input{position:absolute;top:4px;right:4px}
.tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:2px}.tag{font-size:10px;line-height:1.5;padding:0 6px;border-radius:6px;background:color-mix(in srgb,var(--tc) 30%,transparent);text-transform:capitalize;font-weight:500;color:var(--tx)}
.row b .tags{justify-content:flex-start}.sheet .tags{justify-content:flex-start;margin:0 0 8px}.tile.hl{box-shadow:0 0 0 3px var(--ac)}
.tile.ghost{background:none;border-style:dashed}
.cnt{text-align:center;color:var(--mut);margin-top:12px}
label{display:block;margin:10px 0;font-size:13px;color:var(--mut)}label input,label select{margin-top:4px;color:var(--tx)}
.two{display:flex;gap:10px}.two>*{flex:1}
.sum{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:10px 0}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:flex-end;z-index:5}
#modal.open{display:flex}
.sheet{background:var(--bg);width:100%;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:80%;overflow:auto}
.sheet h2{margin-top:0}.own{display:flex;gap:10px;align-items:center;color:var(--tx);font-size:16px}
.var{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.var button{border:0;background:none;color:var(--mut);font-size:16px}
.add{display:flex;gap:8px;margin-top:10px}
.gen{margin:12px 0}.gh{display:flex;gap:8px;align-items:baseline;margin-bottom:4px}.gh small{color:var(--mut)}.gh small:last-child{margin-left:auto}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.fill{height:100%;background:var(--ac);border-radius:6px;transition:width .4s}.fill.full{background:var(--ok)}
.fine{color:var(--mut);font-size:12px;margin-top:22px}.cnt.ok{color:var(--ok);font-weight:600}
.grid.done{outline:2px solid var(--ok);outline-offset:6px;border-radius:12px;margin:8px 6px}
.fl{position:fixed;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;z-index:9}
.fb{background:var(--card);border:2px solid var(--ok);color:var(--ok);font-weight:700;padding:12px 22px;border-radius:14px;animation:pop 1.6s ease both}
.fl i{position:absolute;width:9px;height:9px;border-radius:2px;animation:fly 1.1s ease-out both}
@keyframes pop{0%{transform:scale(.6);opacity:0}15%{transform:scale(1.08);opacity:1}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
@keyframes fly{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--x),var(--y)) rotate(240deg) scale(.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.fl i{display:none}}
.stick{position:sticky;top:0;z-index:2;background:var(--bg);padding:4px 0 6px}
.stick .two{margin-top:2px}.stick select{padding:9px 10px;font-size:15px}
.st{color:#d9a400}.jp{margin:0 0 10px}.jp button{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:10px}
.bar.sm{height:5px;width:130px;margin:5px auto 0}
.map{display:flex;flex-wrap:wrap;gap:5px}.map i{display:block;width:24px;height:24px;border-radius:6px;border:1px solid var(--bd)}
.note{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;margin:0 0 8px;font-size:13px}
.note button{border:1px solid var(--bd);background:var(--bg);border-radius:999px;padding:5px 12px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(58px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);border-radius:12px;padding:10px 14px;display:none;justify-content:space-between;align-items:center;z-index:20;font-size:14px}
#toast.on{display:flex}#toast button{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline}
.tile{transition:transform .1s}.tile:active{transform:scale(.97)}
.grid.sl{animation:sl .22s ease-out}.grid.sr{animation:sr .22s ease-out}
@keyframes sl{from{transform:translateX(40px);opacity:.3}}@keyframes sr{from{transform:translateX(-40px);opacity:.3}}

popopoh-ihqlqoqeqjpqrbbpmpkplnlplhlhdbdndrl-iplpjpmpfnina-dh";
const TN=["normal","fighting","flying","poison","ground","rock","bug","ghost","steel","fire","water","grass","electric","psychic","ice","dragon","dark","fairy"];
const TC=["#A8A77A","#C22E28","#A98FF3","#A33EA1","#E2BF65","#B6A136","#A6B91A","#735797","#B7B7CE","#EE8130","#6390F0","#7AC74C","#F7D02C","#F95587","#96D9D6","#6F35FC","#705746","#D685AD"];
const tp=n=>[TY[2*n-2],TY[2*n-1]].filter(c=>c!="-").map(c=>c.charCodeAt(0)-97);
const tags=n=>'<span class="tags">'+tp(n).map(t=>'<span class="tag" style="--tc:'+TC[t]+'">'+TN[t]+'</span>').join("")+'</span>';
const KEY="pokebinder_v1",$=id=>document.getElementById(id);
let S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S)S={setup:false,name:"My Pokémon Binder",count:N.length,rows:3,cols:3,sides:1,owned:{},vars:{}};
S.up=S.up||{};
let tab=S.setup?(S.tab||"list"):"setup",page=S.page||0,hl=0,flt="all",q="",rst=0,tfl=-1,gf=-1,LK={},U=[],pend=null,pgDone=false,dirc="",tmr;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nf=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
const total=()=>Math.min(S.count,N.length),per=()=>S.rows*S.cols,pages=()=>Math.ceil(total()/per());
const plabel=p=>S.sides==2?"Sheet "+((p>>1)+1)+(p%2?" · Back":" · Front"):"Page "+(p+1);
const nlabel=n=>plabel(Math.floor((n-1)/per()))+" · slot "+((n-1)%per()+1);
const ownedCount=()=>{let c=0;for(let n=1;n<=total();n++)if(S.owned[n])c++;return c};
function head(){$("title").textContent=S.name;const o=ownedCount(),t=total();$("prog").textContent=o+"/"+t+" · "+Math.round(o/t*100)+"%"}
const R=["Kanto","Johto","Hoenn","Sinnoh","Unova","Kalos","Alola","Galar","Paldea"],G=[151,251,386,493,649,721,809,905,1025],DAY=864e5;
const genOf=n=>G.findIndex(e=>n<=e);
function genDone(g){const a=g?G[g-1]+1:1,b=Math.min(G[g],total());if(a>b)return false;for(let n=a;n<=b;n++)if(!S.owned[n])return false;return true}
function theme(){const r=document.documentElement;S.theme&&S.theme!="auto"?r.setAttribute("data-theme",S.theme):r.removeAttribute("data-theme")}
function toast(m,u){const t=$("toast");t.innerHTML='<span>'+esc(m)+'</span>'+(u?'<button id="ub">Undo</button>':"");t.className="on";clearTimeout(tmr);tmr=setTimeout(()=>t.className="",5000)}
function setOwned(n,v){
 const was=S.owned[n]?1:0;if(was==(v?1:0))return;
 U.push({n,o:was});if(U.length>30)U.shift();
 S.owned[n]=v?1:0;save();head();toast((v?"Ticked ":"Unticked ")+N[n-1],1);
 try{navigator.vibrate&&navigator.vibrate(10)}catch(e){}
 if(v){const g=genOf(n);if(genDone(g))pend=R[g]+" complete!";else{const o=ownedCount();if(o%100==0)pend=o+" cards collected!"}}
}
function flush(){const m=pend||(pgDone?"Page complete":null);pend=null;pgDone=false;if(m)burst(m)}
function bkAge(){return S.lastBackup?Math.floor((Date.now()-S.lastBackup)/DAY):null}
function bkNote(){const d=bkAge();if(ownedCount()<10||(d!==null&&d<14))return"";return '<div class="note"><span>'+(d===null?"You haven’t backed up yet.":"Last backup "+d+" days ago.")+'</span><button id="bkb">Copy backup</button></div>'}
function doBackup(){
 S.lastBackup=Date.now();save();const t=JSON.stringify(S);
 try{navigator.clipboard&&navigator.clipboard.writeText(t)}catch(e){}
 const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);try{document.execCommand("copy")}catch(e){}ta.remove();
 toast("Backup copied. Paste it into Notes.");
}
function nextMissing(){
 const t=total(),inPage=hl&&Math.floor((hl-1)/per())==page,st=inPage?hl+1:page*per()+1;
 for(let k=0;k<t;k++){const n=((st-1+k)%t)+1;if(!S.owned[n]){page=Math.floor((n-1)/per());hl=n;return true}}
 return false;
}
function go(p,d){page=Math.max(0,Math.min(p,pages()-1));hl=0;dirc=d||"";S.page=page;save();vBinder();flush()}
function render(){
 head();S.tab=tab;S.page=page;save();
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==tab));
 ({list:vList,binder:vBinder,stats:vStats,setup:vSetup})[tab]();
 if(tab=="list"||tab=="binder")$("main").insertAdjacentHTML("afterbegin",bkNote());
 flush();
}
function vList(){
 $("main").innerHTML='<div class="stick"><input id="q" type="search" placeholder="Search Pokémon or #" autocomplete="off" autocapitalize="off" value="'+esc(q)+'"><div class="chips">'+["all","missing","owned","upgrade"].map(f=>'<button data-f="'+f+'" class="'+(flt==f?"on":"")+'">'+f+'</button>').join("")+'</div><div class="two"><select id="tf"><option value="-1">All types</option>'+TN.map((t,i)=>'<option value="'+i+'"'+(tfl==i?" selected":"")+'>'+t+'</option>').join("")+'</select><select id="gf"><option value="-1">All generations</option>'+R.map((r,i)=>'<option value="'+i+'"'+(gf==i?" selected":"")+'>Gen '+(i+1)+' · '+r+'</option>').join("")+'</select></div></div><div id="res"></div>';
 $("tf").onchange=e=>{tfl=+e.target.value;rows()};$("gf").onchange=e=>{gf=+e.target.value;rows()};
 $("q").oninput=e=>{q=e.target.value;rows()};
 document.querySelectorAll(".chips button").forEach(b=>b.onclick=()=>{flt=b.dataset.f;vList()});
 rows();
}
function rows(){
 const k=nf(q);let a=[];
 for(let n=1;n<=total();n++){
  if(tfl>=0&&!tp(n).includes(tfl))continue;if(gf>=0&&genOf(n)!=gf)continue;
  if(flt=="missing"&&S.owned[n])continue;if(flt=="owned"&&!S.owned[n])continue;if(flt=="upgrade"&&!S.up[n])continue;
  if(!k||nf(N[n-1]).includes(k)||String(n)==q.trim())a.push(n);
 }
 if(k)a.sort((x,y)=>(nf(N[y-1]).startsWith(k)-nf(N[x-1]).startsWith(k))||x-y);
 $("res").innerHTML=a.length?a.map(n=>'<div class="row" data-n="'+n+'" style="border-left:4px solid '+TC[tp(n)[0]]+'">'+im(n)+'<span class="num">#'+n+'</span><b>'+N[n-1]+(S.up[n]?' <span class="st">★</span>':'')+tags(n)+'</b><small>'+nlabel(n)+'</small><input type="checkbox" '+(S.owned[n]?"checked":"")+'></div>').join(""):'<p class="empty">No matches</p>';
}
function pstat(p){let c=0,k=0;for(let i=1;i<=per();i++){const n=p*per()+i;if(n>total())break;k++;if(S.owned[n])c++}return[c,k]}
function vBinder(){
 const ps=pages();page=Math.max(0,Math.min(page,ps-1));const st=page*per(),[have,cnt]=pstat(page);
 const done=cnt>0&&have==cnt,pc=cnt?Math.round(have/cnt*100):0;
 let opts="";for(let p=0;p<ps;p++){const[c,k]=pstat(p);opts+='<option value="'+p+'"'+(p==page?" selected":"")+'>'+plabel(p)+' · '+c+'/'+k+'</option>'}
 let h='<div class="nav"><button data-a="-1">◀</button><div><b>'+plabel(page)+'</b><small>'+(page+1)+' of '+ps+' page sides</small><div class="bar sm"><div class="fill'+(done?' full':'')+'" style="width:'+pc+'%"></div></div></div><button data-a="1">▶</button></div><div class="two jp"><button id="nm">Next missing</button><select id="pj">'+opts+'</select></div><div class="grid'+(dirc?' '+dirc:'')+'" id="gr" style="grid-template-columns:repeat('+S.cols+',1fr)">';
 for(let i=0;i<per();i++){
  const n=st+i+1;if(n>total()){h+='<div class="tile ghost"></div>';continue}
  const v=(S.vars[n]||[]).length,tt=tp(n);
  h+='<div class="tile'+(S.owned[n]?" got":"")+(n==hl?" hl":"")+'" data-t="'+n+'" style="--c:'+TC[tt[0]]+';--c2:'+TC[tt[1]===undefined?tt[0]:tt[1]]+'"><small>#'+n+(S.up[n]?' ★':'')+'</small>'+im(n)+'<b>'+N[n-1]+'</b>'+tags(n)+(v?'<small>'+v+' variant'+(v>1?'s':'')+'</small>':'')+'<input type="checkbox" '+(S.owned[n]?"checked":"")+'></div>';
 }
 $("main").innerHTML=h+'</div><p class="cnt'+(done?' ok':'')+'">'+(done?'✓ Page complete · ':'')+have+'/'+cnt+' on this page</p>';
 if(done)$("gr").classList.add("done");
 const was=LK[page];LK[page]=done;if(done&&was===false)pgDone=true;
 dirc="";$("pj").onchange=e=>{page=+e.target.value;hl=0;S.page=page;save();vBinder()};
}
function burst(m){
 const f=document.createElement("div");f.className="fl";let h='<div class="fb">'+esc(m)+'</div>';
 for(let i=0;i<28;i++){const a=Math.random()*6.28,d=90+Math.random()*130;h+='<i style="--x:'+Math.round(Math.cos(a)*d)+'px;--y:'+Math.round(Math.sin(a)*d)+'px;background:'+TC[(Math.random()*18)|0]+';animation-delay:'+Math.round(Math.random()*120)+'ms"></i>'}
 f.innerHTML=h;document.body.appendChild(f);setTimeout(()=>f.remove(),1800);
 try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}
}
function vStats(){
 const bar=(l,s,o,t)=>{const p=Math.round(o/t*100);return '<div class="gen"><div class="gh"><b>'+l+'</b><small>'+s+'</small><small>'+o+'/'+t+' · '+p+'%</small></div><div class="bar"><div class="fill'+(o==t?' full':'')+'" style="width:'+p+'%"></div></div></div>'};
 const ps=pages();let pc=0,map='<div class="map">',vc=0,uc=0;
 for(let p=0;p<ps;p++){const[c,k]=pstat(p),f=k?c/k:0;if(k&&c==k)pc++;map+='<i data-p="'+p+'" title="'+plabel(p)+'" style="background:'+(f==1?"var(--ok)":"color-mix(in srgb,var(--ok) "+Math.round(f*55)+"%,transparent)")+'"></i>'}
 for(let n=1;n<=total();n++){vc+=(S.vars[n]||[]).length;if(S.up[n])uc++}
 let h='<h2>Overall</h2>'+bar('All','',ownedCount(),total())+'<p class="sum">'+pc+' of '+ps+' page sides complete · '+vc+' variants noted · '+uc+' upgrades wanted</p><h2>By generation</h2>';
 let a=1;G.forEach((g,i)=>{const b=Math.min(g,total());if(a<=b){let o=0;for(let n=a;n<=b;n++)if(S.owned[n])o++;h+=bar('Gen '+(i+1),R[i],o,b-a+1)}a=g+1});
 const d=bkAge();
 $("main").innerHTML=h+'<h2>Pages</h2>'+map+'</div><p class="fine">Tap a square to open that page. Darker green means more of the page is filled.</p><h2>Backup</h2><p class="sum">'+(d===null?"Not backed up yet.":d==0?"Backed up today.":"Last backup "+d+" day"+(d>1?"s":"")+" ago.")+'</p><button class="pri" id="bkb">Copy backup</button><p class="fine">Paste it into Notes or a message to yourself. Restore it from Setup, then Import.</p>';
}
function vSetup(){
 const o=(v,t)=>'<option value="'+v+'"'+(S.sides==v?" selected":"")+'>'+t+'</option>';
 $("main").innerHTML='<h2>Binder setup</h2><label>Binder name<input id="sn" value="'+esc(S.name)+'"></label><label>Projected cards (max '+N.length+')<input id="sc" type="number" inputmode="numeric" min="1" max="'+N.length+'" value="'+S.count+'"></label><div class="two"><label>Rows<input id="sr" type="number" inputmode="numeric" min="1" max="6" value="'+S.rows+'"></label><label>Columns<input id="sl" type="number" inputmode="numeric" min="1" max="6" value="'+S.cols+'"></label></div><label>Page use<select id="ss">'+o(1,"Front only")+o(2,"Front and back")+'</select></label>'+(SP.length?'<label class="own" style="margin:14px 0"><input id="sp" type="checkbox" '+(S.sprites===false?"":"checked")+'> Show sprites</label>':"")+'<label>Theme<select id="th"></select></label><p class="sum" id="sum"></p><button class="pri" id="sv">Save binder</button><h2>Backup</h2><textarea id="bk" rows="4" placeholder="Tap Export to copy your data, or paste a backup here and tap Import"></textarea><div class="two" style="margin-top:8px"><button id="ex">Export</button><button id="im">Import</button></div><button class="danger" id="rs">Reset all ticks and variants</button><p class="fine">Unofficial fan-made tracker. Not affiliated with or endorsed by Nintendo, Game Freak, Creatures or The Pokémon Company. Pokémon and its character names are trademarks of their owners.</p>';
 const rd=()=>({c:Math.max(1,Math.min(N.length,+$("sc").value||1)),r:Math.max(1,Math.min(6,+$("sr").value||1)),l:Math.max(1,Math.min(6,+$("sl").value||1)),s:+$("ss").value});
 const sum=()=>{const d=rd(),ps=Math.ceil(d.c/(d.r*d.l));$("sum").textContent=d.c+" cards at "+d.r*d.l+" per page side = "+ps+" page sides, so "+(d.s==2?Math.ceil(ps/2)+" sleeve sheets (front and back)":ps+" sleeve pages")+"."};
 ["sc","sr","sl","ss"].forEach(i=>$(i).oninput=sum);sum();
 $("th").innerHTML=["auto","light","dark"].map(v=>'<option value="'+v+'"'+((S.theme||"auto")==v?" selected":"")+'>'+v[0].toUpperCase()+v.slice(1)+'</option>').join("");$("th").onchange=e=>{S.theme=e.target.value;save();theme()};
 $("sv").onclick=()=>{const d=rd();Object.assign(S,{name:$("sn").value.trim()||"My Pokémon Binder",count:d.c,rows:d.r,cols:d.l,sides:d.s,setup:true,sprites:$("sp")?$("sp").checked:false});save();tab="list";page=0;render()};
 $("ex").onclick=()=>{S.lastBackup=Date.now();save();$("bk").value=JSON.stringify(S);$("bk").select();try{document.execCommand("copy")}catch(e){}};
 $("im").onclick=()=>{try{const d=JSON.parse($("bk").value);if(!d||typeof d.owned!="object")throw 0;S=d;S.setup=true;S.up=S.up||{};save();render()}catch(e){$("im").textContent="Invalid backup"}};
 $("rs").onclick=()=>{if(!rst){rst=1;$("rs").textContent="Tap again to confirm reset";return}rst=0;S.owned={};S.vars={};S.up={};save();render()};
}
function modal(n){
 const v=S.vars[n]||[],m=$("modal");
 m.innerHTML='<div class="sheet"><h2>'+im(n)+' #'+n+' '+N[n-1]+'</h2>'+tags(n)+'<label class="own"><input id="mo" type="checkbox" '+(S.owned[n]?"checked":"")+'> Slot filled</label><label class="own"><input id="mu" type="checkbox" '+(S.up[n]?"checked":"")+'> ★ Want an upgrade</label><div>'+(v.map((x,i)=>'<div class="var">'+esc(x)+'<button data-d="'+i+'">✕</button></div>').join("")||'<small style="color:var(--mut)">No variants noted yet</small>')+'</div><div class="add"><input id="vi" placeholder="Add variant, e.g. Holo or Surfing"><button id="va">Add</button></div><button class="pri" id="vc">Done</button></div>';
 m.className="open";
 $("mo").onchange=e=>setOwned(n,e.target.checked);
 $("mu").onchange=e=>{if(e.target.checked)S.up[n]=1;else delete S.up[n];save()};
 $("va").onclick=()=>{const t=$("vi").value.trim();if(!t)return;(S.vars[n]=S.vars[n]||[]).push(t);setOwned(n,1);save();modal(n)};
 m.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{S.vars[n].splice(+b.dataset.d,1);save();modal(n)});
 $("vc").onclick=()=>{m.className="";render()};
 m.onclick=e=>{if(e.target===m){m.className="";render()}};
}
$("main").onclick=e=>{
 const t=e.target;
 if(t.id=="bkb"){doBackup();render();return}
 if(t.id=="nm"){if(nextMissing())render();else toast("Nothing missing. Binder complete!");return}
 const a=t.closest("[data-a]");if(a){go(page+ +a.dataset.a,+a.dataset.a>0?"sl":"sr");return}
 const mp=t.closest("[data-p]");if(mp){tab="binder";page=+mp.dataset.p;hl=0;render();window.scrollTo(0,0);return}
 const r=t.closest(".row"),tl=t.closest(".tile[data-t]");if(!r&&!tl)return;
 const n=+(r?r.dataset.n:tl.dataset.t);
 if(t.type=="checkbox"){setOwned(n,t.checked);if(tl)vBinder();flush();return}
 if(r){tab="binder";page=Math.floor((n-1)/per());hl=n;render();window.scrollTo(0,0)}else modal(n);
};
$("toast").onclick=e=>{if(e.target.id=="ub"){const a=U.pop();if(a){S.owned[a.n]=a.o;save();pend=null;render()}$("toast").className=""}};
let sx=0,sy=0;
$("main").addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$("main").addEventListener("touchend",e=>{if(tab!="binder"||$("modal").className)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>60&&Math.abs(dx)>1.5*Math.abs(dy))go(page+(dx<0?1:-1),dx<0?"sl":"sr")},{passive:true});
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;rst=0;render()});
theme();render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
